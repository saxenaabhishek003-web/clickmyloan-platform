<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E00"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF4ED"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid elements -->
  <circle cx="150" cy="120" r="300" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="1050" cy="500" r="350" fill="#FFBA74" opacity="0.15"/>
  
  <!-- Logo Emblem -->
  <g transform="translate(100, 120)">
    <rect width="84" height="84" rx="20" fill="url(#brandGrad)"/>
    <path d="M46 16 L22 48 H44 L40 70 L64 38 H42 Z" fill="#FF5E00"/>
    <text x="110" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">
      Click<tspan fill="#FED7AA">My</tspan>Loan
    </text>
  </g>

  <!-- Tagline & Description -->
  <text x="100" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">
    Finance Your Next Move
  </text>
  <text x="100" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FED7AA">
    With Absolute Transparency
  </text>

  <text x="100" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#FFF4ED">
    Instant Personal, Business &amp; Travel Loans &bull; 100% Digital Processing &bull; RBI-Compliant LSP
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(100, 480)">
    <rect width="210" height="46" rx="23" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="105" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#7DD3FC" text-anchor="middle">
      ✓ Upfront APR &amp; KFS
    </text>

    <rect x="230" width="220" height="46" rx="23" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="340" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#7DD3FC" text-anchor="middle">
      ✓ Zero Advance Fees
    </text>

    <rect x="470" width="230" height="46" rx="23" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="585" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#7DD3FC" text-anchor="middle">
      ✓ Bank-Grade Privacy
    </text>
